 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timekeeper Stopwatch</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    background: #111318;
    color: #f5f5f5;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
}

.container {
    width: 620px;
    text-align: center;
    padding: 25px 20px 40px;
}

/* HEADER */

.brand {
    color: #f0a832;
    font-size: 13px;
    letter-spacing: 6px;
    font-weight: bold;
    margin-bottom: 10px;
}

h1 {
    font-size: 32px;
    margin-bottom: 45px;
}

/* CLOCK */

.clock {
    width: 380px;
    height: 380px;
    border-radius: 50%;
    margin: auto;
    position: relative;

    background:
        repeating-conic-gradient(
            from 0deg,
            #555 0deg 1deg,
            transparent 1deg 6deg
        ),
        #1b1f24;

    border: 2px solid #30353b;
    box-shadow:
        inset 0 0 30px rgba(0,0,0,0.35),
        0 10px 40px rgba(0,0,0,0.25);
}

/* INNER CIRCLE */

.clock::after {
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 1px solid #292e34;
}

/* TICK MARKS */

.tick {
    position: absolute;
    width: 2px;
    height: 12px;
    background: #777d85;
    left: 50%;
    top: 4px;
    transform-origin: 50% 186px;
}

.tick.big {
    height: 20px;
    width: 3px;
    background: #c3c7cc;
}

/* NUMBERS */

.number {
    position: absolute;
    font-size: 15px;
    color: #e1e1e1;
    font-weight: 500;
    transform: translate(-50%, -50%);
}

/* SECOND HAND */

.hand {
    position: absolute;
    width: 3px;
    height: 160px;
    background: #f0a832;
    left: 50%;
    top: 30px;
    transform-origin: 50% 160px;
    transform: translateX(-50%) rotate(0deg);
    z-index: 5;
    box-shadow: 0 0 8px rgba(240,168,50,0.5);
}

.center-dot {
    position: absolute;
    width: 12px;
    height: 12px;
    background: #f0a832;
    border-radius: 50%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 6;
}

/* TIMER */

.timer {
    position: absolute;
    width: 100%;
    top: 145px;
    z-index: 10;
    font-family: "Courier New", monospace;
    font-size: 48px;
    font-weight: bold;
    letter-spacing: 1px;
}

.milliseconds {
    font-size: 19px;
    color: #7890a8;
    margin-left: 3px;
}

/* STATUS */

.status {
    position: absolute;
    top: 212px;
    left: 50%;
    transform: translateX(-50%);
    border: 1px solid #273c40;
    border-radius: 20px;
    padding: 6px 18px;
    font-family: monospace;
    letter-spacing: 3px;
    font-size: 12px;
    color: #7aa5a5;
}

/* BUTTONS */

.buttons {
    display: grid;
    grid-template-columns: 1fr 1.5fr 1fr;
    gap: 12px;
    margin-top: 48px;
}

button {
    height: 61px;
    border-radius: 15px;
    background: transparent;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-2px);
}

#lapBtn {
    border: 1px solid #164b4c;
    color: #158080;
}

#startBtn {
    border: none;
    background: #f0a832;
    color: #111;
}

#resetBtn {
    border: 1px solid #472a2b;
    color: #9d3939;
}

/* SHORTCUTS */

.shortcuts {
    margin: 40px 0;
    color: #8c8f97;
    font-family: monospace;
    font-size: 14px;
}

.key {
    display: inline-block;
    border: 1px solid #444951;
    background: #25292f;
    color: #ddd;
    padding: 3px 7px;
    border-radius: 5px;
    margin-right: 5px;
}

/* LAP TABLE */

.lap-box {
    border: 1px solid #30353b;
    border-radius: 18px;
    overflow: hidden;
    background: #1a1e23;
}

.lap-header {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    padding: 17px 20px;
    border-bottom: 1px solid #30353b;
    color: #8b9bae;
    font-size: 12px;
    letter-spacing: 3px;
    font-family: monospace;
}

.lap-header span:nth-child(1) {
    text-align: left;
}

.lap-header span:nth-child(2) {
    text-align: center;
}

.lap-header span:nth-child(3) {
    text-align: right;
}

.laps {
    max-height: 230px;
    overflow-y: auto;
}

.empty {
    padding: 40px 10px;
    color: #8d96a3;
    font-size: 16px;
}

.empty small {
    display: block;
    margin-top: 10px;
    color: #69717d;
}

.lap-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    padding: 14px 20px;
    border-bottom: 1px solid #292e34;
    font-family: monospace;
    color: #d5d8dc;
}

.lap-row span:nth-child(1) {
    text-align: left;
}

.lap-row span:nth-child(2) {
    text-align: center;
}

.lap-row span:nth-child(3) {
    text-align: right;
}

/* FOOTER */

.footer {
    margin-top: 25px;
    color: #8c9098;
    font-size: 14px;
}

.footer span {
    color: #ff5555;
    font-size: 18px;
}

/* RESPONSIVE */

@media (max-width: 600px) {

    .container {
        width: 100%;
    }

    .clock {
        width: 320px;
        height: 320px;
    }

    .tick {
        transform-origin: 50% 156px;
    }

    .hand {
        height: 135px;
        top: 25px;
    }

    .timer {
        top: 120px;
        font-size: 40px;
    }

    .status {
        top: 180px;
    }

    .buttons {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="brand">TIMEKEEPER</div>
    <h1>Stopwatch</h1>

    <!-- CLOCK -->

    <div class="clock" id="clock">

        <div class="hand" id="hand"></div>
        <div class="center-dot"></div>

        <div class="timer">
            <span id="time">00:00</span>
            <span class="milliseconds" id="ms">.00</span>
        </div>

        <div class="status" id="status">
            READY
        </div>

    </div>

    <!-- BUTTONS -->

    <div class="buttons">

        <button id="lapBtn" onclick="lap()">
            ⚑ &nbsp; Lap
        </button>

        <button id="startBtn" onclick="startPause()">
            ▶ &nbsp; Start
        </button>

        <button id="resetBtn" onclick="reset()">
            ⟳ &nbsp; Reset
        </button>

    </div>

    <!-- SHORTCUTS -->

    <div class="shortcuts">
        <span class="key">Space</span>
        start / pause
        &nbsp; • &nbsp;
        <span class="key">L</span>
        lap
        &nbsp; • &nbsp;
        <span class="key">R</span>
        reset
    </div>

    <!-- LAP TABLE -->

    <div class="lap-box">

        <div class="lap-header">
            <span>LAP</span>
            <span>SPLIT</span>
            <span>TOTAL</span>
        </div>

        <div class="laps" id="laps">

            <div class="empty" id="empty">
                ⏱
                <br><br>
                No laps recorded yet
                <small>
                    Hit "Lap" while the stopwatch is running.
                </small>
            </div>

        </div>

    </div>

    <div class="footer">
        Made with <span>♥</span> by Devaki
    </div>

</div>


<script>

let running = false;
let startTime = 0;
let elapsed = 0;
let animation;

let lapCount = 0;
let lastLapTime = 0;


/* CLOCK TICKS */

const clock = document.getElementById("clock");

for (let i = 0; i < 60; i++) {

    const tick = document.createElement("div");

    tick.className = "tick";

    if (i % 5 === 0) {
        tick.classList.add("big");
    }

    tick.style.transform =
        `translateX(-50%) rotate(${i * 6}deg)`;

    clock.appendChild(tick);

}


/* NUMBERS */

const numbers = [
    [60, 50, 12],
    [5, 82, 21],
    [10, 91, 34],
    [15, 96, 50],
    [20, 91, 66],
    [25, 82, 80],
    [30, 50, 88],
    [35, 18, 80],
    [40, 9, 66],
    [45, 4, 50],
    [50, 9, 34],
    [55, 18, 21]
];

numbers.forEach(item => {

    const number = document.createElement("div");

    number.className = "number";

    number.textContent = item[0];

    number.style.left = item[1] + "%";
    number.style.top = item[2] + "%";

    clock.appendChild(number);

});


/* ELEMENTS */

const timeDisplay =
    document.getElementById("time");

const msDisplay =
    document.getElementById("ms");

const hand =
    document.getElementById("hand");

const status =
    document.getElementById("status");

const startBtn =
    document.getElementById("startBtn");

const laps =
    document.getElementById("laps");


/* FORMAT TIME */

function formatTime(milliseconds) {

    let totalSeconds =
        Math.floor(milliseconds / 1000);

    let minutes =
        Math.floor(totalSeconds / 60);

    let seconds =
        totalSeconds % 60;

    let ms =
        Math.floor((milliseconds % 1000) / 10);

    minutes =
        String(minutes).padStart(2, "0");

    seconds =
        String(seconds).padStart(2, "0");

    ms =
        String(ms).padStart(2, "0");

    return {
        main: `${minutes}:${seconds}`,
        ms: ms
    };
}


/* UPDATE CLOCK */

function update() {

    if (!running) return;

    elapsed =
        Date.now() - startTime;

    const formatted =
        formatTime(elapsed);

    timeDisplay.textContent =
        formatted.main;

    msDisplay.textContent =
        "." + formatted.ms;

    /* Rotate second hand */

    const seconds =
        (elapsed / 1000) % 60;

    hand.style.transform =
        `translateX(-50%) rotate(${seconds * 6}deg)`;

    animation =
        requestAnimationFrame(update);
}


/* START / PAUSE */

function startPause() {

    if (!running) {

        startTime =
            Date.now() - elapsed;

        running = true;

        status.textContent = "RUNNING";

        startBtn.innerHTML =
            "⏸ &nbsp; Pause";

        update();

    } else {

        running = false;

        cancelAnimationFrame(animation);

        status.textContent = "PAUSED";

        startBtn.innerHTML =
            "▶ &nbsp; Start";
    }
}


/* LAP */

function lap() {

    if (!running) return;

    lapCount++;

    const split =
        elapsed - lastLapTime;

    lastLapTime =
        elapsed;

    const splitTime =
        formatTime(split);

    const totalTime =
        formatTime(elapsed);

    const empty =
        document.getElementById("empty");

    if (empty) {
        empty.remove();
    }

    const row =
        document.createElement("div");

    row.className = "lap-row";

    row.innerHTML = `
        <span>Lap ${lapCount}</span>
        <span>${splitTime.main}.${splitTime.ms}</span>
        <span>${totalTime.main}.${totalTime.ms}</span>
    `;

    laps.prepend(row);
}


/* RESET */

function reset() {

    running = false;

    cancelAnimationFrame(animation);

    elapsed = 0;
    startTime = 0;
    lapCount = 0;
    lastLapTime = 0;

    timeDisplay.textContent =
        "00:00";

    msDisplay.textContent =
        ".00";

    hand.style.transform =
        "translateX(-50%) rotate(0deg)";

    status.textContent =
        "READY";

    startBtn.innerHTML =
        "▶ &nbsp; Start";

    laps.innerHTML = `
        <div class="empty" id="empty">
            ⏱
            <br><br>
            No laps recorded yet
            <small>
                Hit "Lap" while the stopwatch is running.
            </small>
        </div>
    `;
}


/* KEYBOARD SHORTCUTS */

document.addEventListener("keydown", function(event) {

    if (event.code === "Space") {

        event.preventDefault();

        startPause();
    }

    if (event.key.toLowerCase() === "l") {

        lap();
    }

    if (event.key.toLowerCase() === "r") {

        reset();
    }

});

</script>

</body>
</html>
